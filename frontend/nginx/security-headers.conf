# Security headers. nginx drops inherited add_header directives in any block
# that declares its own, so nginx.conf includes this file in the server block AND in every
# location that uses add_header. "always" also sends them on error responses (404, 413, 5xx).

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; img-src 'self' data: blob: https://*.mzstatic.com https://i.ytimg.com; media-src 'self' https://*.itunes.apple.com https://*.mzstatic.com; connect-src 'self' https://itunes.apple.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Profiles (/<username>) are shared by link only, never listed by search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
# YouTube embeds need a referrer, so not "no-referrer".
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore HSTS over plain http (local and e2e stacks); it applies once TLS is in front.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), autoplay=(self \"https://www.youtube-nocookie.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\"), picture-in-picture=(self \"https://www.youtube-nocookie.com\")" always;

# Reverse proxy to the API, shared by every /api location in nginx.conf.
#
# The API trusts TRUSTED_PROXY_COUNT hops of X-Forwarded-* (werkzeug ProxyFix), so these
# headers are *set* (replacing anything the client sent), never passed through. Behind a TLS
# load balancer (TRUSTED_PROXY_COUNT=2), append instead so ProxyFix sees one value per hop:
#   proxy_set_header X-Forwarded-Proto "$http_x_forwarded_proto, $scheme";

proxy_pass http://sotd_api;

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

proxy_read_timeout 75s;

# The API already sends nosniff on every response; keep a single copy (from security-headers.conf).
proxy_hide_header X-Content-Type-Options;

# nginx for the web image: serves the built SPA and proxies /api to the
# API container. Runs as the unprivileged nginx user, so it listens on 8080 and keeps its
# pid and temp files in /tmp (the container's root filesystem is read-only).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    # nginx's own redirects stay relative, so they keep the scheme and host of a TLS proxy.
    absolute_redirect off;

    # One JSON object per line. Paths only: query strings are never logged.
    log_format json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_status":"$upstream_status","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Static assets only: proxied API responses (which may carry tokens) are never compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's embedded DNS. Re-resolving "api" lets nginx follow a recreated API container.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream sotd_api {
        zone sotd_api 64k;
        server api:8000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # JSON request bodies; the upload location raises it.
        client_max_body_size 256k;

        include security-headers.conf;

        # Bodies rejected here never reach the API, so answer in the API's error format.
        error_page 413 @payload_too_large;

        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"payload_too_large","message":"File is too large."}}\n';
        }

        location = /api/uploads {
            # 10 MiB file plus multipart overhead; the API enforces the exact limits.
            client_max_body_size 11m;
            include api-proxy.conf;
        }

        location /api/ {
            include api-proxy.conf;
        }

        # Liveness of nginx itself, for the container healthcheck.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Content-hashed build output: cache forever.
        location /assets/ {
            include security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Everything else is the SPA, including profiles at /<username>: always revalidate, and fall
        # back to index.html.
        location / {
            include security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}

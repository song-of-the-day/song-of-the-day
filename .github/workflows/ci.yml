# CI: backend and frontend checks, then end-to-end tests against the
# production images. `make check` runs the same backend and frontend steps locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sotd
          POSTGRES_PASSWORD: sotd
          POSTGRES_DB: sotd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=sotd --dbname=sotd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      # A fresh "sotd_test_<worker>_<hex>" database is created per run on this server.
      TEST_DATABASE_URL: postgresql+psycopg://sotd:sotd@localhost:5432/sotd_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Test (pytest, coverage >= 90%)
        run: >-
          uv run pytest -n auto --cov --cov-report=term-missing:skip-covered
          --cov-fail-under=90

  frontend:
    name: Frontend (eslint, prettier, tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          # The pnpm version comes from "packageManager".
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Format (prettier --check)
        run: pnpm format:check

      - name: Type check (tsc -b)
        run: pnpm typecheck

      - name: Test (vitest with coverage thresholds)
        run: pnpm coverage

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright on the compose stack)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Every `docker compose` command below uses the base file plus the e2e overrides.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
      # Throwaway: the e2e database lives on tmpfs and is never published.
      POSTGRES_PASSWORD: e2e-throwaway-postgres-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Bake's compose loader resolves env_file before applying the e2e override's `!reset`,
      # so it needs a .env to exist. The containers never read it (the override resets it).
      - name: Create an empty .env
        run: touch .env

      - name: Build images (GitHub Actions layer cache)
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.e2e.yml
          targets: api,web
          load: true
          set: |
            *.cache-from=type=gha,scope=sotd-e2e
            *.cache-to=type=gha,scope=sotd-e2e,mode=max

      - name: Start the e2e stack
        # Rebuilds from the builder's cache (populated above), so this proves the images build.
        run: docker compose up -d --build --wait --wait-timeout 180

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (Chromium)
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the e2e stack
        if: always()
        run: docker compose down -v --remove-orphans

[project]
name = "sotd"
version = "0.1.0"
description = "Song of the Day: a private, anti-social music journal (Flask API)."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "limits>=5.8.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "time-machine>=3.5.1",
    "types-flask-migrate>=4.1.0.20260508",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sotd"]

# --- Ruff (lint + format) ------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "D", "C4", "PT", "RET", "DTZ",
    "T20", "ERA", "ARG",
]
# D105/D107: magic methods and __init__ are documented on the class (Google style).
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["sotd"]

[tool.ruff.lint.per-file-ignores]
# Tests use literal throwaway passwords and secrets as fixtures.
# The leading `**/` keeps the patterns matching whether ruff runs from `backend/` (Makefile, CI)
# or from the repository root (the pre-commit hook passes `--config`, which sets the project root
# to the current directory).
"**/tests/**" = ["S101", "S105", "S106", "D", "ARG", "PLR2004"]
# Its normalization fixtures deliberately use non-ASCII forms (dashes, fullwidth letters).
"**/tests/test_youtube_match.py" = ["RUF001"]
"**/migrations/versions/**" = ["D", "E501"]

[tool.ruff.format]
docstring-code-format = true

# --- mypy -------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
# Flask-Login and Flask-WTF ship no type information and have no stub packages.
module = ["flask_login", "flask_login.*", "flask_wtf", "flask_wtf.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest -----------------------------------------------------------------------
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: slower tests (database round-trips such as full migration cycles)"]
xfail_strict = true
filterwarnings = [
    "error",
    # Flask-Login 0.6.3 computes the remember cookie's expiry with datetime.utcnow().
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:flask_login",
]

# --- coverage ---------------------------------------------------------------------
[tool.coverage.run]
source = ["sotd"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]
